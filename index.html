<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ec">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>شیشه‌ی نیایش</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="sky" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
    <i></i>
  </div>
  <section id="welcome" class="welcome">
    <div class="card">
      <h1 id="welcomeTitle"></h1>
      <p id="welcomeText"></p>
      <p id="daily" class="daily"></p>
      <button id="startBtn" class="btn" type="button"></button>
    </div>
  </section>
  <div id="app" class="app" hidden>
    <header class="top">
      <button id="btnMenu" class="btn ghost" type="button"></button>
      <div class="brand-wrap">
        <h1 id="brand"></h1>
      </div>
      <button id="btnLight" class="btn" type="button"></button>
      <button id="btnPhoto" class="btn" type="button"></button>
      <button id="btnSave" class="btn" type="button"></button>
    </header>
    <div class="workspace">
      <aside id="panel" class="panel closed"></aside>
      <div class="stage">
        <canvas id="view" width="800" height="1000" aria-label="شیشه"></canvas>
        <button id="btnFit" class="fit" type="button"></button>
        <button id="btnLove" class="love" type="button">💌</button>
      </div>
    </div>
    <footer class="bench">
      <div class="quick">
        <button id="btnUndo" class="btn ghost" type="button"></button>
        <button id="btnRedo" class="btn ghost" type="button"></button>
        <button id="btnFresh" class="btn ghost" type="button"></button>
        <label id="sizeLabel" for="sizeRange"></label>
        <strong id="sizeValue">14</strong>
        <input id="sizeRange" type="range" min="2" max="64" value="14">
        <button id="quickColor" class="swatch" type="button" aria-label="رنگ"></button>
      </div>
      <div id="colors" class="colors"></div>
      <nav id="tabs" class="tabs"></nav>
      <nav id="dock" class="dock"></nav>
    </footer>
  </div>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <div id="cheer" class="cheer" hidden></div>
  <div id="bloom" class="bloom" hidden></div>
  <input id="fileCamera" type="file" accept="image/*" capture="environment" hidden>
  <input id="fileTrace" type="file" accept="image/*" hidden>
  <input id="fileBackup" type="file" accept="application/json,.json" hidden>
  <script type="module" src="js/main.js"></script>
</body>
</html>
